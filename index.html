<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <h1>Student Sprint</h1>
   
     <input type="text" placeholder="Enter subject" id="subject">
     <br>
     <input type="number" placeholder="duration" id="duration">
     <br>
     <select name="" id="priority">
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
     </select>
     <br>
     <button type="submit" id="addtask">Submit</button>
     <br>
     
     
     <div id="Taskcontainer"></div>
     <h3 id="totaltask">Total task: 0</h3>
      <p id="emptystg">No Task Available</p>
     <button id="Clearall">Clear All</button>
    
     <script src="script.js"></script>
</body>
</html>
