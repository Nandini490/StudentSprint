<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <h1 id="heading">Student Sprint</h1>
    <p id="description">Plan your study. Track your progress.</p>
    <div id="addtaskbutton">
         <input type="text" placeholder="Enter subject" id="subject">
     <br>
     <input type="number" placeholder="duration" id="duration">
     <br>
     <select name="" id="priority">
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
     </select>
     <br>
     <button type="submit" id="addtask">Add Task</button>
     <br>
    </div>
   
    
     <section id="statistics">
        <div id="totaltask"> <h3 >Total task: 0</h3></div>
        <div id="completedtasks"><h3 >Completed:0</h3></div> 
     </section>
     
     <div id="Taskcontainer"></div>
      <p id="emptystg">No Task Available</p>
     <button id="Clearall">Clear All</button>
    
     <script src="script.js"></script>
</body>
</html>
